name: Sync Upstream | bin456789/reinstall
on:
  workflow_dispatch:
  # UTC 04:00 = 北京时间中午12点；可自行调整定时
  schedule:
    - cron: '0 0 * * *'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync upstream repository
        uses: aormsby/Fork-Sync-With-Upstream-action@v3
        with:
          upstream_repository: bin456789/reinstall
          target_branches: 'main'
          sync_tags: true
